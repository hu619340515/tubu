<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Sun -->
  <circle cx="256" cy="170" r="64" fill="url(#sunGrad)" opacity="0.9" />

  <!-- Distant Mountains -->
  <polygon points="90,400 210,210 320,380" fill="#065f46" opacity="0.7" />
  <polygon points="210,210 245,265 210,275 180,265" fill="url(#snowGrad)" opacity="0.8" />

  <!-- Main Mountain Peak -->
  <polygon points="170,420 330,160 480,420" fill="#022c22" />
  <polygon points="330,160 375,230 335,245 295,230" fill="url(#snowGrad)" />

  <!-- Foreground Mountain Trail -->
  <polygon points="40,460 170,300 310,460" fill="#064e3b" />
  <polygon points="170,300 200,345 170,355 145,345" fill="url(#snowGrad)" />

  <!-- Pine trees on ridge -->
  <path d="M120,430 L130,410 L140,430 Z M135,435 L145,415 L155,435 Z" fill="#022c22" />
  <path d="M370,440 L382,415 L394,440 Z" fill="#022c22" />

  <!-- Checkmark Badge in Foreground -->
  <g transform="translate(256, 380)">
    <circle cx="0" cy="0" r="68" fill="#10b981" stroke="#ffffff" stroke-width="8" />
    <path d="M-28,-2 L-10,18 L30,-22" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
